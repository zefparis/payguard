workflows:
  android-apk-workflow:
    name: PayGuard SA - Android APK
    max_build_duration: 45
    environment:
      groups:
        - payguard_secrets
      vars:
        VITE_API_URL: "https://hybrid-vector-api-m5xt.onrender.com"
        VITE_TENANT_ID: "payguard-demo"
        PACKAGE_NAME: "com.iasolution.payguard"
      android_signing:
        - payguard_android_keystore
      node: v20.19.0
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Add and sync Capacitor Android
        script: |
          npm install @capacitor/android
          npx cap add android 2>/dev/null || true
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true
