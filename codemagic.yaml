workflows:
  ios-workflow:
    name: PayGuard SA iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.iasolution.payguard
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_API_URL: "https://hybrid-vector-api-m5xt.onrender.com"
        VITE_TENANT_ID: "payguard-demo"
      groups:
        - payguard_secrets
    scripts:
      - name: Generate .env.production from Codemagic env
        script: |
          set -euo pipefail
          {
            echo "VITE_API_URL=$VITE_API_URL"
            echo "VITE_TENANT_ID=$VITE_TENANT_ID"
            echo "VITE_HV_API_KEY=$VITE_HV_API_KEY"
          } > .env.production
          echo "--- .env.production generated ---"
          wc -l .env.production
          grep -c "^VITE_" .env.production

      - name: Install dependencies
        script: |
          set -euo pipefail
          npm install

      - name: Build web assets
        script: |
          set -euo pipefail
          npm run build

      - name: Capacitor sync
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Fix Podfile deployment target
        script: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/App/Podfile
          grep platform ios/App/Podfile

      - name: Install pods
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Force iOS deployment target
        script: |
          set -euo pipefail
          cd ios/App
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | head -5

      - name: Set build number
        script: |
          set -euo pipefail
          NEXT_BUILD=$((100 + ${BUILD_NUMBER:-1}))
          echo "Codemagic BUILD_NUMBER=$BUILD_NUMBER"
          echo "Next iOS build number will be: $NEXT_BUILD"
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $NEXT_BUILD
          echo "--- Verification ---"
          agvtool what-version -terse

      - name: Configure signing
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true

  android-apk-workflow:
    name: PayGuard SA - Android APK
    max_build_duration: 45
    environment:
      groups:
        - payguard_secrets
      android_signing:
        - payguard_android_keystore
      vars:
        VITE_API_URL: "https://hybrid-vector-api-m5xt.onrender.com"
        VITE_TENANT_ID: "payguard-demo"
      node: v22.14.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web
        script: npm run build

      - name: Setup Android platform
        script: |
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Generate Android icons
        script: |
          # Assure le bon nom de fichier (lowercase)
          if [ -f "resources/Icon.png" ] && [ ! -f "resources/icon.png" ]; then
            cp resources/Icon.png resources/icon.png
          fi
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android

      - name: Patch MainActivity for WebView permissions
        script: |
          MAIN="android/app/src/main/java/com/hvguard/payguard/MainActivity.java"
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'JAVAEOF'
          package com.hvguard.payguard;

          import android.Manifest;
          import android.webkit.PermissionRequest;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.content.pm.PackageManager;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  String[] perms = { Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO };
                  boolean need = false;
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          need = true; break;
                      }
                  }
                  if (need) ActivityCompat.requestPermissions(this, perms, 1001);
              }

              @Override
              protected BridgeWebChromeClient makeBridgeWebChromeClient() {
                  return new BridgeWebChromeClient(this.bridge) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  };
              }
          }
          JAVAEOF

      - name: Patch AndroidManifest
        script: |
          python3 << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()

          extra_perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />"""

          xml = xml.replace(
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n' + extra_perms
          )
          xml = xml.replace(
              "<application",
              '<application android:hardwareAccelerated="true" android:usesCleartextTraffic="false"'
          )

          with open(path, "w") as f:
              f.write(xml)
          print("AndroidManifest.xml patched")
          PYEOF

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Sign APK
        script: |
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          echo "Using: $APKSIGNER"
          echo "Keystore: $CM_KEYSTORE_PATH"
          echo "Alias: $CM_KEY_ALIAS"
          "$APKSIGNER" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"
          "$APKSIGNER" verify --verbose "$APK_SIGNED"
          echo "APK signé OK"

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true