workflows:
  ios-workflow:
    name: PayGuard SA iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.iasolution.payguard
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_API_URL: "https://hybrid-vector-api-m5xt.onrender.com"
        VITE_TENANT_ID: "payguard-demo"
      groups:
        - payguard_secrets
    scripts:
      - name: Generate .env.production from Codemagic env
        script: |
          set -euo pipefail
          {
            echo "VITE_API_URL=$VITE_API_URL"
            echo "VITE_TENANT_ID=$VITE_TENANT_ID"
            echo "VITE_HV_API_KEY=$VITE_HV_API_KEY"
          } > .env.production
          echo "--- .env.production generated ---"
          wc -l .env.production
          grep -c "^VITE_" .env.production

      - name: Install dependencies
        script: |
          set -euo pipefail
          npm install

      - name: Build web assets
        script: |
          set -euo pipefail
          npm run build

      - name: Capacitor sync
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Fix Podfile deployment target
        script: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/App/Podfile
          grep platform ios/App/Podfile

      - name: Install pods
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Force iOS deployment target
        script: |
          set -euo pipefail
          cd ios/App
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | head -5

      - name: Set build number
        script: |
          set -euo pipefail
          NEXT_BUILD=$((100 + ${BUILD_NUMBER:-1}))
          echo "Codemagic BUILD_NUMBER=$BUILD_NUMBER"
          echo "Next iOS build number will be: $NEXT_BUILD"
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $NEXT_BUILD
          echo "--- Verification ---"
          agvtool what-version -terse

      - name: Configure signing
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true