workflows:
  ios-workflow:
    name: PayGuard SA iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.iasolution.payguard
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_API_URL: "https://hybrid-vector-api-m5xt.onrender.com"
        VITE_TENANT_ID: "payguard-demo"
      groups:
        - payguard_secrets
    scripts:
      - name: Generate .env.production from Codemagic env
        script: |
          set -euo pipefail
          {
            echo "VITE_API_URL=$VITE_API_URL"
            echo "VITE_TENANT_ID=$VITE_TENANT_ID"
          } > .env.production
          echo "--- .env.production generated ---"
          wc -l .env.production
          grep -c "^VITE_" .env.production

      - name: Install dependencies
        script: |
          set -euo pipefail
          npm install

      - name: Build web assets
        script: |
          set -euo pipefail
          npm run build

      - name: Capacitor sync
        script: |
          set -euo pipefail
          npx cap sync ios

      - name: Fix Podfile deployment target
        script: |
          set -euo pipefail
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/App/Podfile
          grep platform ios/App/Podfile

      - name: Install pods
        script: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Force iOS deployment target
        script: |
          set -euo pipefail
          cd ios/App
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' App.xcodeproj/project.pbxproj
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" App.xcodeproj/project.pbxproj | head -5

      - name: Set build number
        script: |
          set -euo pipefail
          NEXT_BUILD=$((100 + ${BUILD_NUMBER:-1}))
          echo "Codemagic BUILD_NUMBER=$BUILD_NUMBER"
          echo "Next iOS build number will be: $NEXT_BUILD"
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $NEXT_BUILD
          echo "--- Verification ---"
          agvtool what-version -terse

      - name: Configure signing
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true

  android-apk-workflow:
    name: PayGuard SA - Android APK
    max_build_duration: 45
    environment:
      groups:
        - payguard_secrets
      android_signing:
        - payguard_android_keystore
      vars:
        VITE_API_URL: "https://payguard.vercel.app/api"
        VITE_TENANT_ID: "payguard-demo"
      node: v22.14.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web
        script: npm run build

      - name: Setup Android platform
        script: |
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Patch version
        script: |
          sed -i '' 's/versionCode 1/versionCode 5/' android/app/build.gradle
          sed -i '' 's/versionName "1.0"/versionName "1.0.5"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Generate Android icons
        script: |
          # Assure le bon nom de fichier (lowercase)
          if [ -f "resources/Icon.png" ] && [ ! -f "resources/icon.png" ]; then
            cp resources/Icon.png resources/icon.png
          fi
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android

      - name: Patch MainActivity for WebView permissions
        script: |
          MAIN="android/app/src/main/java/com/iasolution/payguard/MainActivity.java"
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'JAVAEOF'
          package com.iasolution.payguard;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final String TAG = "PayGuard";
              private ActivityResultLauncher<String> audioPermLauncher;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  Log.d(TAG, "onCreate START");

                  audioPermLauncher = registerForActivityResult(
                      new ActivityResultContracts.RequestPermission(),
                      granted -> Log.d(TAG, "RECORD_AUDIO permission result: " + granted)
                  );

                  super.onCreate(savedInstanceState);

                  // Clear any cached WebView permission denials
                  WebStorage.getInstance().deleteAllData();
                  GeolocationPermissions.getInstance().clearAll();
                  getBridge().getWebView().clearCache(true);

                  // Ensure media playback doesn't require user gesture
                  WebSettings ws = getBridge().getWebView().getSettings();
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  Log.d(TAG, "WebSettings mediaPlaybackRequiresUserGesture=false");

                  // Override WebChromeClient to auto-grant WebView permission requests
                  getBridge().getWebView().setWebChromeClient(
                      new BridgeWebChromeClient(getBridge()) {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              String[] resources = request.getResources();
                              StringBuilder sb = new StringBuilder();
                              for (String r : resources) sb.append(r).append(", ");
                              Log.d(TAG, "onPermissionRequest: " + sb.toString());
                              runOnUiThread(() -> {
                                  request.grant(resources);
                                  Log.d(TAG, "onPermissionRequest: GRANTED");
                              });
                          }
                      }
                  );

                  // Request RECORD_AUDIO at runtime if not already granted
                  boolean hasAudio = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          == PackageManager.PERMISSION_GRANTED;
                  Log.d(TAG, "RECORD_AUDIO already granted: " + hasAudio);
                  if (!hasAudio) {
                      audioPermLauncher.launch(Manifest.permission.RECORD_AUDIO);
                  }

                  Log.d(TAG, "onCreate END");
              }
          }
          JAVAEOF

      - name: Patch AndroidManifest
        script: |
          python3 << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()

          extra_perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />"""

          xml = xml.replace(
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n' + extra_perms
          )
          xml = xml.replace(
              "<application",
              '<application android:hardwareAccelerated="true" android:usesCleartextTraffic="false"'
          )

          with open(path, "w") as f:
              f.write(xml)
          print("AndroidManifest.xml patched")
          PYEOF

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Sign APK
        script: |
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          echo "Using: $APKSIGNER"
          echo "Keystore: $CM_KEYSTORE_PATH"
          echo "Alias: $CM_KEY_ALIAS"
          "$APKSIGNER" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"
          "$APKSIGNER" verify --verbose "$APK_SIGNED"
          echo "APK signé OK"

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - contact@ia-solution.fr
        notify:
          success: true
          failure: true